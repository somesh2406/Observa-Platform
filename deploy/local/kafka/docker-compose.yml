# Local development only. Single-node KRaft Kafka; not a production topology.
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: observa-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Host applications (including the Go ingestion service) connect here.
      - "127.0.0.1:9092:9092"
      # Controller port is deliberately not published to the host.
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "Mk3OEYBSD3T24uRHDjUIWw"
    volumes:
      - observa_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observa-net

  # Optional UI. Start only when needed:
  # docker compose -f deploy/local/kafka/docker-compose.yml --profile ui up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: observa-kafka-ui
    profiles: ["ui"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8023:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "observa-local"
      # Container-to-container traffic uses the internal Docker DNS name.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    networks: [observa-net]

volumes:
  observa_kafka_data:

networks:
  observa-net:
    name: observa-local-net
    external: true
