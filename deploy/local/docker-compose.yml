# Single public entry point for local Observa requests: Envoy on 127.0.0.1:8443.
# Ingestion is not published to the host and is reachable only over this Docker network.
name: observa-local
services:

  redis-edge:
    image: redis:7.4-alpine
    container_name: observa-redis-edge
    command:
      - redis-server
      - --save          # disable RDB snapshots
      - ""
      - --appendonly    # disable AOF
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"   # evict least-recently-used counters under pressure
      - --tcp-keepalive
      - "60"
    ports:
      - "127.0.0.1:6379:6379"   # host-local only; not exposed externally
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    networks: [observa-net]

  redis-tenant:
    image: redis:7.4-alpine
    container_name: observa-redis-tenant
    command:
      - redis-server
      - --appendonly
      - "yes"           # durability across restart
      - --appendfsync
      - "everysec"      # fsync once per second — the production default
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"    # refuse writes when full — do not silently drop counters
      - --tcp-keepalive
      - "60"
    ports:
      - "127.0.0.1:6380:6379"   # host port 6380 → container 6379
    volumes:
      - redis-tenant-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    networks: [observa-net]

  ratelimit-config:
    build:
      context: ../..
      dockerfile: deploy/local/rate-limit/Dockerfile
    restart: "no"
    environment:
      OBSERVA_EDGE_RATE_LIMIT_REQUESTS: ${OBSERVA_EDGE_RATE_LIMIT_REQUESTS:-100}
      OBSERVA_EDGE_RATE_LIMIT_UNIT: ${OBSERVA_EDGE_RATE_LIMIT_UNIT:-Second}
    volumes:
      - ./rate-limit/config.yaml.tmpl:/template/config.yaml.tmpl:ro
      - observa_ratelimit_config:/output

  ratelimit:
    image: envoyproxy/ratelimit:v1.4.0
    restart: unless-stopped
    command: ["/bin/ratelimit"]
    environment:
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis-edge:6379
      CONFIG_TYPE: FILE
      USE_STATSD: "false"
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_APPDIRECTORY: config
      RUNTIME_WATCH_ROOT: "false"
      HEALTHY_WITH_AT_LEAST_ONE_CONFIG_LOADED: "true"
      LOG_LEVEL: info
      GRPC_PORT: "8081"
      HTTP_PORT: "8080"
    volumes:
      - observa_ratelimit_config:/data/ratelimit/config:ro
    depends_on:
      redis-edge:
        condition: service_healthy
      ratelimit-config:
        condition: service_completed_successfully
    networks: [observa-net]

  kafka:
    image: apache/kafka:4.3.1
    container_name: observa-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "Mk3OEYBSD3T24uRHDjUIWw"
    volumes:
      - observa_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [observa-net]
  
  vault:
    image: hashicorp/vault:2.1.2
    container_name: observa-vault-dev
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-dev-only-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [observa-net]

  ingestion:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: ingestion
    restart: unless-stopped
    environment:
      OBSERVA_CONFIG_FILE: /app/configs/ingestion.local.json
      OBSERVA_ENVIRONMENT: production
      OBSERVA_HTTP_ADDRESS: 0.0.0.0:8080
      OBSERVA_DEVELOPMENT_ALLOW_UNAUTHENTICATED: "false"
      OBSERVA_KAFKA_BROKERS: kafka:29092
      OBSERVA_TENANT_RATE_LIMIT_REQUESTS: ${OBSERVA_TENANT_RATE_LIMIT_REQUESTS:-100}
      OBSERVA_TENANT_RATE_LIMIT_WINDOW: ${OBSERVA_TENANT_RATE_LIMIT_WINDOW:-1m}
      OBSERVA_TENANT_RATE_LIMIT_REDIS_ADDRESS: ${OBSERVA_TENANT_RATE_LIMIT_REDIS_ADDRESS:-redis-tenant:6379}
      OBSERVA_TENANT_RATE_LIMIT_REDIS_USERNAME: ${OBSERVA_TENANT_RATE_LIMIT_REDIS_USERNAME:-}
      OBSERVA_TENANT_RATE_LIMIT_REDIS_PASSWORD: ${OBSERVA_TENANT_RATE_LIMIT_REDIS_PASSWORD:-}
      OBSERVA_TENANT_RATE_LIMIT_REDIS_DB: ${OBSERVA_TENANT_RATE_LIMIT_REDIS_DB:-0}
      OBSERVA_TENANT_RATE_LIMIT_REDIS_TLS: ${OBSERVA_TENANT_RATE_LIMIT_REDIS_TLS:-false}
      OBSERVA_TENANT_RATE_LIMIT_DIAL_TIMEOUT: ${OBSERVA_TENANT_RATE_LIMIT_DIAL_TIMEOUT:-2s}
    depends_on:
      kafka:
        condition: service_healthy
      redis-tenant:
        condition: service_healthy
      kafka-topic-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [observa-net]

  envoy:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    restart: unless-stopped
    environment:
      OBSERVA_JWT_ISSUER: ${OBSERVA_JWT_ISSUER:-https://pahalssouat.nimblelos.com/}
      OBSERVA_JWT_AUDIENCE: ${OBSERVA_JWT_AUDIENCE:-observa-gateway}
      OBSERVA_JWKS_URL: ${OBSERVA_JWKS_URL:-https://pahalssouat.nimblelos.com:8091/oidc/jwks}
      OBSERVA_JWKS_HOST: ${OBSERVA_JWKS_HOST:-pahalssouat.nimblelos.com}
      OBSERVA_JWKS_PORT: ${OBSERVA_JWKS_PORT:-8091}
    volumes:
      - ../gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${OBSERVA_GATEWAY_TLS_CERT_FILE:-../gateway/local/tls.crt}:/etc/envoy/certs/tls.crt:ro
      - ${OBSERVA_GATEWAY_TLS_KEY_FILE:-../gateway/local/tls.key}:/etc/envoy/certs/tls.key:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      ingestion:
        condition: service_healthy
      ratelimit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9901/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [observa-net]
  
  kafka-topic-provisioner:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: topic-provisioner
    restart: "no"
    environment:
      KAFKA_BROKERS: kafka:29092
      OBSERVA_ENVIRONMENT: local
      KAFKA_TOPIC_CATALOG: /app/topics.yaml
    volumes:
      - ./kafka/topics.yaml:/app/topics.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [observa-net]

volumes:
  observa_kafka_data:
  observa_ratelimit_config:
  redis-tenant-data:
    driver: local

networks:
  observa-net:
    name: observa-local-net
    driver: bridge
